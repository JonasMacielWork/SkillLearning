version: '3.8'

services:
  skilllearning-api:
    container_name: skilllearning-api
    build:
      context: ../
      dockerfile: Build/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres-primary;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__ReadOnly: "Host=postgres-primary;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: redis:6379
      Kafka__BootstrapServers: kafka:29092
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: http://skilllearning-api:5000
      Jwt__Audience: https://skilllearning-api:4200
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always
    networks:
      - skilllearning-net

  skilllearning-workers-emailsender:
    container_name: skilllearning-workers-emailsender
    build:
      context: ../
      dockerfile: Build/Dockerfile.Workers.EmailSender
    environment:
      Kafka__BootstrapServers: kafka:29092
      EmailSettings__SmtpServer: smtp.gmail.com
      EmailSettings__SmtpPort: 587
      EmailSettings__SmtpUsername: ${EMAIL_SENDER_USER}
      EmailSettings__SmtpPassword: ${EMAIL_SENDER_PASSWORD}
      EmailSettings__SenderEmail: ${EMAIL_SENDER_USER}
      EmailSettings__SenderName: SkillLearning
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - skilllearning-net

  postgres-primary:
    image: postgres:15
    container_name: postgres-primary
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - skilllearning-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 45s

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - skilllearning-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8081:5540"
    networks:
      - skilllearning-net
    depends_on:
      - redis

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - skilllearning-net
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Listeners
      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      # Other settings
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "kafka:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - skilllearning-net

  xray-daemon:
    image: amazon/aws-xray-daemon:latest
    container_name: xray-daemon
    ports:
      - "2000:2000/udp"
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - skilllearning-net

networks:
  skilllearning-net:
    driver: bridge

volumes:
  kafka-data:
  pgdata:
  redis-data:

