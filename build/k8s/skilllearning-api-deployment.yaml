apiVersion: apps/v1
kind: Deployment
metadata:
  name: skilllearning-api
  labels:
    app: skilllearning-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skilllearning-api
  template:
    metadata:
      labels:
        app: skilllearning-api
    spec:
      containers:
        - name: skilllearning-api
          image: skilllearning-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: skilllearning-secrets
                  key: POSTGRES_CONNECTION_STRING
            - name: ConnectionStrings__ReadOnly
              valueFrom:
                secretKeyRef:
                  name: skilllearning-secrets
                  key: POSTGRES_CONNECTION_STRING
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: skilllearning-secrets
                  key: JWT_KEY
            - name: Redis__ConnectionString
              value: "redis:6379"
            - name: Kafka__BootstrapServers
              value: "kafka:9092"
      restartPolicy: Always