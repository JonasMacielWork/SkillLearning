# Docker Compose para Arquitetura Híbrida
# Roda APENAS a aplicação na EC2, usando RDS e ElastiCache da AWS
#
# Uso: docker-compose -f docker-compose.hybrid.yml up -d

version: '3.8'

services:
  # API Principal
  skilllearning-api:
    build:
      context: ../Backend
      dockerfile: ../Build/Dockerfile
    container_name: skilllearning-api
    ports:
      - "5000:8080"  # Expor na porta 5000 para ALB ou acesso direto
    environment:
      # Conexões para serviços AWS (passadas via environment variables da EC2)
      - ConnectionStrings__Default=${RDS_CONNECTION_STRING}
      - ConnectionStrings__ReadOnly=${RDS_CONNECTION_STRING}
      - Redis__ConnectionString=${ELASTICACHE_ENDPOINT}:6379
      
      # JWT
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=SkillLearning
      - Jwt__Audience=SkillLearning
      - Jwt__ExpiryInMinutes=60
      
      # Email (usando AWS SES ou SMTP externo)
      - Email__SenderName=SkillLearning
      - Email__SenderEmail=${EMAIL_SENDER_USER}
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__SmtpUser=${EMAIL_SENDER_USER}
      - Email__SmtpPassword=${EMAIL_SENDER_PASSWORD}
      - Email__EnableSsl=true
      
      # Kafka substituído por Redis Pub/Sub
      - UseRedisForMessaging=true
      
      # AWS X-Ray
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      
      # Configurações gerais
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      - skilllearning-workers
      
  # Worker de Email (sem Kafka, usa Redis)
  skilllearning-workers:
    build:
      context: ../Backend
      dockerfile: ../Build/Dockerfile.Workers.EmailSender
    container_name: skilllearning-workers
    environment:
      # Mesmas configurações da API
      - ConnectionStrings__Default=${RDS_CONNECTION_STRING}
      - Redis__ConnectionString=${ELASTICACHE_ENDPOINT}:6379
      
      # Email
      - Email__SenderName=SkillLearning
      - Email__SenderEmail=${EMAIL_SENDER_USER}
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__SmtpUser=${EMAIL_SENDER_USER}
      - Email__SmtpPassword=${EMAIL_SENDER_PASSWORD}
      - Email__EnableSsl=true
      
      # Redis para mensageria (substitui Kafka)
      - UseRedisForMessaging=true
      
      # AWS
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      
    restart: unless-stopped

  # Nginx para proxy reverso (opcional)
  nginx:
    image: nginx:alpine
    container_name: skilllearning-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - skilllearning-api
    restart: unless-stopped
    profiles:
      - with-nginx  # docker-compose --profile with-nginx up

# Volumes para logs (opcional)
volumes:
  app-logs:
    driver: local

# Network personalizada
networks:
  default:
    name: skilllearning-network